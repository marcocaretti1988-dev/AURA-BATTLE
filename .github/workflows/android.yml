name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["godot/**", ".github/workflows/android.yml"]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Godot 4.7.2 + export templates
        run: |
          cd ~
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip && mv Godot_v4.7.2-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable /tmp/tpl
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Android settings
        run: |
          keytool -genkeypair -keystore ~/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.7.tres
      - name: Import
        run: ~/godot --headless --path godot --import || true
      - name: Install Android build template
        run: ~/godot --headless --path godot --install-android-build-template || true
      - name: Export AAB (unsigned, signed later with upload key)
        run: |
          mkdir -p godot/build
          ~/godot --headless --path godot --export-release "Android" build/AuraBattle.aab
      - name: Export test APK (debug key)
        run: ~/godot --headless --path godot --export-debug "Android APK" build/AuraBattle_test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aura-battle-android
          path: godot/build/*
